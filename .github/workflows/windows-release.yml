name: Build and Release Windows Binary

on:
  push:
    branches:
      - V1-Foundation-Web-App-Win-joel
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller main.spec

      - name: Create Self-Extracting EXE
        run: |
          # Use 7z to create a self-extracting archive
          # 'a' adds to archive, '-sfx' makes it self-extracting
          7z a -sfx LimbusCalculator-Windows.exe ./dist/LimbusCalculator/*

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-windows-build
          name: Windows Build (Development)
          draft: false
          prerelease: true
          files: LimbusCalculator-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
